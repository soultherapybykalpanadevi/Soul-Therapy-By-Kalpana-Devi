
<script>
document.getElementById("year").textContent =
  new Date().getFullYear();

const SUPABASE_FUNCTION_URL =
  "https://dwttxgeapquhozmtacnw.supabase.co/functions/v1/submit-booking";

const form = document.getElementById("bookingForm");
const serviceSelect = document.getElementById("service");
const priceDisplay = document.getElementById("selectedPrice");
const statusBox = document.getElementById("formStatus");
const submitButton = document.getElementById("submitBooking");
const photoInput = document.getElementById("photo");

serviceSelect.addEventListener("change", () => {
  const price = serviceSelect.selectedOptions[0].dataset.price;

  priceDisplay.textContent = price
    ? "₹" + Number(price).toLocaleString("en-IN")
    : "தேர்வு செய்யவும்";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!form.reportValidity()) return;

  const option = serviceSelect.selectedOptions[0];
  const photo = photoInput.files[0];

  if (photo) {
    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowedTypes.includes(photo.type)) {
      statusBox.hidden = false;
      statusBox.textContent =
        "JPG, PNG அல்லது WebP புகைப்படத்தைத் தேர்ந்தெடுக்கவும்.";
      return;
    }

    if (photo.size > 5 * 1024 * 1024) {
      statusBox.hidden = false;
      statusBox.textContent =
        "புகைப்படத்தின் அளவு 5 MB-க்குள் இருக்க வேண்டும்.";
      return;
    }
  }

  const formData = new FormData();

  formData.append(
    "customer_name",
    document.getElementById("name").value.trim()
  );
  formData.append(
    "phone",
    document.getElementById("phone").value.trim()
  );
  formData.append(
    "email",
    document.getElementById("email").value.trim()
  );
  formData.append("service_type", serviceSelect.value);
  formData.append("price_inr", option.dataset.price);
  formData.append(
    "preferred_date",
    document.getElementById("date").value
  );
  formData.append(
    "preferred_time",
    document.getElementById("time").value
  );
  formData.append("guidance_topic", "");
  formData.append(
    "message",
    document.getElementById("concern").value.trim()
  );

  if (photo) {
    formData.append("photo", photo);
  }

  statusBox.hidden = false;
  statusBox.textContent =
    "உங்கள் முன்பதிவு கோரிக்கை அனுப்பப்படுகிறது...";
  submitButton.disabled = true;

  try {
    const response = await fetch(SUPABASE_FUNCTION_URL, {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.error || "முன்பதிவைச் சமர்ப்பிக்க முடியவில்லை."
      );
    }

    statusBox.textContent =
      "நன்றி! உங்கள் முன்பதிவு கோரிக்கை பெறப்பட்டது. முன்பதிவு எண்: " +
      result.booking.id +
      ". அடுத்த கட்டத்தை உறுதிப்படுத்த உங்களைத் தொடர்புகொள்வோம்.";

    form.reset();
    priceDisplay.textContent = "தேர்வு செய்யவும்";

  } catch (error) {
    console.error("Booking submission failed:", error);

    statusBox.textContent =
      error instanceof Error
        ? "முன்பதிவு அனுப்பப்படவில்லை: " + error.message
        : "முன்பதிவு அனுப்பப்படவில்லை. மீண்டும் முயற்சிக்கவும்.";
  } finally {
    submitButton.disabled = false;
  }
});
</script>
